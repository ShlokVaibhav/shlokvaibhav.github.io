<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const BOOKS = {
  'hume-harris': 'Hume: An Intellectual Biography'
};

const params   = new URLSearchParams(location.search);
const book     = params.get('book');
const ch       = params.get('ch');
const content  = document.getElementById('content');
const bc       = document.getElementById('breadcrumb');

if (!book || !BOOKS[book]) {
  content.innerHTML = '<p>Book not found.</p>';
} else {
  const bookTitle = BOOKS[book];
  const mdPath    = ch ? `reviews/${book}/${ch}.md` : `reviews/${book}/index.md`;

  fetch(mdPath)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      content.innerHTML = marked.parse(md);

      const h1 = content.querySelector('h1');
      const pageTitle = h1 ? h1.textContent : bookTitle;
      document.title = pageTitle + ' — Shlok Vaibhav';

      if (ch) {
        bc.innerHTML = `<a href="books.html">Books</a><span class="bc-sep">›</span><a href="review.html?book=${book}">${bookTitle}</a><span class="bc-sep">›</span><span>${pageTitle}</span>`;
      } else {
        bc.innerHTML = `<a href="books.html">Books</a><span class="bc-sep">›</span><span>${pageTitle}</span>`;
      }
    })
    .catch(() => {
      content.innerHTML = '<p>Review not found or not yet written.</p>';
      bc.innerHTML = `<a href="books.html">Books</a><span class="bc-sep">›</span><span>${bookTitle}</span>`;
    });
}
</script>
